      <text x="386" y="385" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTH · CRUD</text>

      <rect x="592" y="396" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE JOBS</text>

