      <text x="360" y="181" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NEXT.JS · APP ROUTER</text>

      <rect x="864" y="80" width="208" height="464" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="908" y="84" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="968" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL SERVICES</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- A1 UI -> Server -->
      <line x1="224" y1="272" x2="296" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A2 Server -> Agent -->
      <line x1="472" y1="272" x2="576" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A3 Agent -> Adzuna -->
      <path d="M 752,236 H 824 Q 832,236 832,228 V 152 Q 832,144 840,144 H 880" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A4 Agent -> OpenAI -->
      <line x1="752" y1="272" x2="880" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A5 Agent -> Browserbase -->
      <path d="M 752,308 H 792 Q 800,308 800,316 V 392 Q 800,400 808,400 H 880" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A6 Server -> InsForge -->
      <line x1="344" y1="320" x2="344" y2="456" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
