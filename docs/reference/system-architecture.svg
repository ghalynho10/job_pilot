      <text x="968" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAI GPT-4o</text>
      <text x="968" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">match · research</text>

      <!-- N7 Browserbase (external) -->
      <rect x="880" y="368" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="368" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
